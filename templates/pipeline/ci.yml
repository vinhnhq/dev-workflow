# Quality gate (added 2026-07 — a broken test once shipped because only
# Vercel's build ran in CI; a broken test once shipped with only the deploy build as CI). Vercel still owns
# deploys; this runs the local gates on every PR.
#
# Secrets:
#   DATABASE_TEST_URL — Neon test-branch connection string. Without it,
#   integration tests are skipped (unit only) so CI stays useful on forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_TEST_URL: ${{ secrets.DATABASE_TEST_URL }}
      # Unit tests never open a connection, but env-server.ts validates the
      # var at import (z.string().min(1)) — so the unit-only path (secret
      # unset) still needs a syntactically-present placeholder.
      DATABASE_URL: ${{ secrets.DATABASE_TEST_URL || 'postgresql://ci:placeholder@localhost:5432/unit-only' }}
    steps:
      - uses: actions/checkout@v5

      # Installs the bun/node pinned in mise.toml — CI and laptops share
      # one source of truth for toolchain versions.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # Bun's package cache — keyed on the lockfile; saves the install step
      # re-downloading every tarball per run.
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Next.js incremental build cache (the "No build cache found" warning).
      # Keyed on lockfile + source hash per nextjs.org/docs/messages/no-cache;
      # restore-keys lets a source-only change reuse the previous cache.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint --type-aware + oxfmt --check + ADR-0012)
        run: bun run lint

      - name: Type-check (tsc 7)
        run: bunx tsc --noEmit

      - name: Tests
        run: |
          if [ -n "$DATABASE_TEST_URL" ]; then
            bun run test:coverage
          else
            echo "::warning::DATABASE_TEST_URL not set — running unit tests only (integration skipped)"
            bunx vitest run --project unit
          fi

      - name: Build
        run: bun run build
