# Seeded from @vinhnnn/dev-workflow templates/pipeline/ — adapt the
# [bracketed] parts to this project, then own it.
#
# Quality gate. Why it exists: a broken test once shipped because the only
# thing running in CI was the deploy provider's build. The host still owns
# deploys; this runs the local gates on every PR.
#
# Secrets:
#   [DATABASE_TEST_URL] — the test-database connection string. Without it,
#   integration tests are skipped (unit only) so CI stays useful on forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_TEST_URL: ${{ secrets.DATABASE_TEST_URL }}
      # Unit tests never open a connection, but the env module validates the
      # var at import (z.string().min(1)) — so the unit-only path (secret
      # unset) still needs a syntactically-present placeholder.
      DATABASE_URL: ${{ secrets.DATABASE_TEST_URL || 'postgresql://ci:placeholder@localhost:5432/unit-only' }}
    steps:
      - uses: actions/checkout@v5

      # Installs the bun/node pinned in mise.toml — CI and laptops share
      # one source of truth for toolchain versions.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # Bun's package cache — keyed on the lockfile; saves the install step
      # re-downloading every tarball per run.
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Framework incremental build cache (e.g. Next.js's "No build cache
      # found" warning). Keyed on lockfile + source hash; restore-keys let a
      # source-only change reuse the previous cache.
      - name: Cache framework build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            build-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The four gates, same as the ship ritual runs locally — in the same
      # order, so a CI failure maps onto a command you can re-run.
      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Tests
        run: |
          if [ -n "$DATABASE_TEST_URL" ]; then
            bun run test:coverage
          else
            echo "::warning::DATABASE_TEST_URL not set — running unit tests only (integration skipped)"
            bun run test:unit   # adapt: whatever selects the unit project
          fi

      - name: Build
        run: bun run build
