name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Installs the node pinned in mise.toml — one source of truth for
      # laptops and runners, so "works on my machine" can't mean a version.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run tests
        run: |
          node --version
          npm test
