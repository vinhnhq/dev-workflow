name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches package.json `engines`. The code runs on older lines,
          # but 20 is EOL (2026-04) and we don't promise what we don't test.
          node-version: 24
      - name: Run tests
        run: npm test
