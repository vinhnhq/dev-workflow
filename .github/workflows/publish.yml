name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC id-token IS the credential under trusted publishing —
      # there is no NPM_TOKEN. Provenance is signed from it too.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Installs the node pinned in mise.toml — same file the laptop reads.
      # Deliberately NOT actions/setup-node with registry-url: that writes an
      # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
      # so npm authenticates as nobody and never attempts the OIDC exchange.
      # The symptom is a bare E404 with no mention of OIDC in the log.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # No npm upgrade step: node 24.18.0 bundles npm 11.16, already past the
      # 11.5.1 that trusted publishing requires. That holds only because the
      # node pin is exact — if mise.toml ever floats, re-check the npm floor.
      - name: Install dependencies
        run: npm ci

      # `npm test` lints first (pretest hook), so a type error in the
      # templates blocks the publish — they are the package's real payload.
      - name: Lint + test
        run: |
          npm --version
          npm test

      # No env: block. The trusted publisher (npmjs.com → package settings)
      # is configured for vinhnhq/dev-workflow + this workflow filename —
      # renaming this file breaks the trust.
      # --provenance is omitted: it is automatic under trusted publishing.
      # The dist-tag is DERIVED, not defaulted. `npm publish` tags whatever it
      # uploads as `latest` regardless of the version string, so a prerelease
      # would silently become the default install for every
      # `bunx @vinhnnn/dev-workflow` user. 3.0.0-beta.0 → beta, 4.0.0-rc.2 → rc,
      # 3.0.0 → latest.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) PRE="${VERSION#*-}"; TAG="${PRE%%.*}" ;;
            *)   TAG="latest" ;;
          esac
          echo "publishing $VERSION with dist-tag: $TAG"
          npm publish --access public --tag "$TAG"
